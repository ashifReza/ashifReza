  <text x="24" y="418" class="l" style="animation-delay:6.3s"><tspan class="dim">Flaky tests:</tspan> <tspan class="gr b">0</tspan>   <tspan class="dim">Bugs caught before prod:</tspan> <tspan class="pk b">a lot</tspan></text>
  <text x="24" y="448" class="l" style="animation-delay:6.6s"><tspan class="gr">➜</tspan> <tspan class="cy">~/career</tspan> <tspan class="dim">hire --role "QA Automation Engineer"</tspan></text>
  <g class="l" style="animation-delay:6.6s"><rect class="cursor" x="452" y="435" width="9" height="17" fill="#22d3ee"/></g>

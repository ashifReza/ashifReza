<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Terminal running a WebdriverIO test suite for Ashif Reza: all specs pass">
  <defs>
    <style>
      text { font: 15px ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; fill: #c9d4e5; white-space: pre; }
      .dim { fill: #6b7a94; } .cy { fill: #22d3ee; } .gr { fill: #34d399; } .yl { fill: #fbbf24; }
      .pk { fill: #f472b6; } .wh { fill: #f1f5f9; font-weight: 700; } .b { font-weight: 700; }
      .title { font: 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8b9bb4; }
      .l { opacity: 0; animation: show .01s forwards; }
      @keyframes show { to { opacity: 1; } }
      .type { animation: type 1.1s steps(38) .3s both; }
      @keyframes type { from { width: 0; } to { width: 400px; } }
      .spin { animation: hide .01s 1.9s forwards; }
      @keyframes hide { to { opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .type { animation: none; width: 400px; } .spin { display: none; } }
    </style>
    <clipPath id="typing"><rect class="type" x="124" y="70" width="400" height="24"/></clipPath>
  </defs>

  <rect width="860" height="470" rx="12" fill="#0b1020"/>

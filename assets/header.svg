<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Ashif Reza, SQA Engineer II, mobile and web test automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="960" height="240" rx="16"/></clipPath>
    <style>
      .name { font: 800 52px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f1f5f9; letter-spacing: -1px; }
      .role { font: 600 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
      .meta { font: 14px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; fill: #8b9bb4; }
      .tag  { font: 700 13px ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; }
      .sweep { animation: sweep 4.5s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes sweep { 0% { transform: translateX(-260px); } 60%,100% { transform: translateX(980px); } }
      .stamp { transform-origin: 812px 120px; animation: stamp .5s 1.2s cubic-bezier(.2,1.6,.4,1) both; }
      @keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(-8deg); } }
      .in { opacity: 0; animation: in .6s ease-out forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .sweep { display: none; } .stamp, .in { animation: none; opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="960" height="240" fill="url(#bg)"/>
    <rect width="960" height="240" fill="url(#grid)" opacity=".55"/>
    <rect class="sweep" x="0" y="0" width="240" height="240" fill="url(#scan)"/>
    <rect x="0" y="0" width="6" height="240" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="239" rx="16" fill="none" stroke="#1f2b47"/>

  <g class="in d1"><text x="48" y="66" class="meta">// describe('Ashif Reza')</text></g>
  <g class="in d2"><text x="46" y="128" class="name">Ashif Reza</text></g>
  <g class="in d3">
    <text x="48" y="164" class="role">SQA Engineer II · Mobile &amp; Web Test Automation</text>
    <text x="48" y="200" class="meta">Appium · WebdriverIO · Playwright · Selenium · Postman · JMeter</text>
  </g>

  <g class="stamp" opacity="0">
    <rect x="712" y="82" width="200" height="76" rx="10" fill="none" stroke="#34d399" stroke-width="3"/>
    <rect x="720" y="90" width="184" height="60" rx="6" fill="none" stroke="#34d399" stroke-width="1" opacity=".6"/>
    <text x="812" y="122" text-anchor="middle" class="tag" fill="#34d399" style="font-size:26px">✓ PASSED</text>
    <text x="812" y="142" text-anchor="middle" class="tag" fill="#34d399" opacity=".8">QA SIGN-OFF</text>
  </g>
</svg>
